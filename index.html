<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ushuaia – Fin del Mundo | Itinerario Interactivo</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3Eo9W4nYJ9d3J1V2h7qQ0l7bY6s4Q="
    crossorigin=""
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f4f7f8;
      color: #243238;
    }

    #app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* =========================
       SIDEBAR
    ========================= */

    #sidebar {
      width: 390px;
      max-width: 100%;
      background: #ffffff;
      height: 100vh;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 3px 0 18px rgba(0,0,0,.15);
    }

    .hero {
      background:
        linear-gradient(
          rgba(5, 36, 48, .72),
          rgba(5, 36, 48, .72)
        ),
        linear-gradient(135deg, #0b586b, #092c3c);

      color: white;
      padding: 28px 24px 25px;
    }

    .hero .eyebrow {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: .8;
      margin-bottom: 8px;
    }

    .hero h1 {
      margin: 0;
      font-size: 29px;
      line-height: 1.12;
    }

    .hero p {
      margin: 10px 0 0;
      opacity: .9;
      line-height: 1.5;
      font-size: 14px;
    }

    .days {
      padding: 15px;
      display: grid;
      gap: 8px;
    }

    .day-btn {
      border: 0;
      background: #edf3f5;
      color: #27404a;
      border-radius: 12px;
      padding: 13px 14px;
      text-align: left;
      cursor: pointer;
      transition: .2s;
      font-size: 14px;
      font-weight: 700;
    }

    .day-btn:hover {
      background: #dcecef;
    }

    .day-btn.active {
      background: #0d6678;
      color: white;
      box-shadow: 0 4px 12px rgba(13,102,120,.25);
    }

    .day-btn small {
      display: block;
      font-weight: 400;
      margin-top: 3px;
      opacity: .8;
    }

    #content {
      padding: 5px 18px 30px;
    }

    .day-header {
      padding: 10px 5px 15px;
    }

    .day-header h2 {
      margin: 0;
      font-size: 22px;
      color: #123d4a;
    }

    .day-header p {
      margin: 6px 0 0;
      font-size: 14px;
      color: #60757d;
      line-height: 1.5;
    }

    .timeline {
      position: relative;
      margin-top: 8px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: #dce7ea;
    }

    .event {
      position: relative;
      margin: 0 0 14px;
      padding-left: 34px;
      cursor: pointer;
    }

    .event-dot {
      position: absolute;
      left: 5px;
      top: 13px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #0d6678;
      border: 3px solid white;
      box-shadow: 0 0 0 2px #0d6678;
      z-index: 2;
    }

    .event-card {
      background: #f8fafb;
      border: 1px solid #e1eaed;
      border-radius: 12px;
      padding: 13px 14px;
      transition: .2s;
    }

    .event:hover .event-card {
      border-color: #8fbec7;
      background: #f1f8fa;
    }

    .event-time {
      font-size: 12px;
      color: #0d6678;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .event-title {
      font-weight: 800;
      color: #263e47;
      font-size: 14px;
    }

    .event-description {
      font-size: 12px;
      line-height: 1.45;
      color: #65777e;
      margin-top: 4px;
    }

    .legend {
      border-top: 1px solid #e4ecee;
      padding: 17px 20px 25px;
      margin-top: 5px;
    }

    .legend-title {
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      font-size: 12px;
      color: #61747b;
    }

    .legend-color {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    /* =========================
       MAP
    ========================= */

    #map {
      flex: 1;
      height: 100vh;
      min-width: 0;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
    }

    .popup {
      min-width: 230px;
    }

    .popup h3 {
      margin: 0 0 5px;
      color: #123f4d;
      font-size: 17px;
    }

    .popup .popup-day {
      display: inline-block;
      background: #e4f1f3;
      color: #0d6678;
      padding: 4px 7px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .popup .popup-time {
      font-weight: 800;
      font-size: 12px;
      color: #0d6678;
    }

    .popup p {
      font-size: 12px;
      line-height: 1.5;
      color: #596c73;
      margin-bottom: 0;
    }

    /* Floating buttons */

    .map-controls {
      position: absolute;
      z-index: 999;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 8px;
    }

    .map-control {
      border: 0;
      background: white;
      padding: 10px 13px;
      border-radius: 9px;
      box-shadow: 0 2px 10px rgba(0,0,0,.18);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      color: #24434d;
    }

    .map-control:hover {
      background: #f1f7f8;
    }

    /* Mobile */

    @media (max-width: 800px) {
      #app {
        display: block;
        height: auto;
      }

      #sidebar {
        width: 100%;
        height: auto;
        max-height: none;
        box-shadow: none;
      }

      #map {
        height: 65vh;
        min-height: 430px;
      }

      .hero {
        padding: 22px 18px;
      }

      .hero h1 {
        font-size: 25px;
      }

      .days {
        grid-template-columns: repeat(5, 1fr);
        padding: 10px;
      }

      .day-btn {
        padding: 10px 5px;
        text-align: center;
        font-size: 11px;
      }

      .day-btn small {
        display: none;
      }

      #content {
        padding: 5px 15px 20px;
      }

      .map-controls {
        top: 10px;
        right: 10px;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside id="sidebar">

    <div class="hero">
      <div class="eyebrow">Tierra del Fuego · Argentina</div>

      <h1>Bienvenidos al<br>Fin del Mundo</h1>

      <p>
        Circuito de 5 días por Ushuaia,
        combinando naturaleza, trekking,
        navegación, historia y aventura.
      </p>
    </div>

    <div class="days">

      <button class="day-btn active" data-day="1">
        DÍA 1
        <small>Bienvenidos al Fin del Mundo</small>
      </button>

      <button class="day-btn" data-day="2">
        DÍA 2
        <small>Parque Nacional + Tren</small>
      </button>

      <button class="day-btn" data-day="3">
        DÍA 3
        <small>Laguna Esmeralda</small>
      </button>

      <button class="day-btn" data-day="4">
        DÍA 4
        <small>Canal Beagle</small>
      </button>

      <button class="day-btn" data-day="5">
        DÍA 5
        <small>Glaciar Martial</small>
      </button>

    </div>

    <div id="content"></div>

    <div class="legend">

      <div class="legend-title">
        Referencias
      </div>

      <div class="legend-item">
        <span class="legend-color" style="background:#2878b5"></span>
        Día 1 · Ushuaia
      </div>

      <div class="legend-item">
        <span class="legend-color" style="background:#2d8a57"></span>
        Día 2 · Parque Nacional
      </div>

      <div class="legend-item">
        <span class="legend-color" style="background:#b27b24"></span>
        Día 3 · Trekking
      </div>

      <div class="legend-item">
        <span class="legend-color" style="background:#7654a8"></span>
        Día 4 · Navegación
      </div>

      <div class="legend-item">
        <span class="legend-color" style="background:#c65345"></span>
        Día 5 · Glaciar Martial
      </div>

    </div>

  </aside>


  <!-- =========================
       MAP
  ========================== -->

  <main id="map"></main>

</div>


<!-- Leaflet -->
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin="">
</script>


<script>

  /*
   * ============================================================
   * DATOS DEL ITINERARIO
   * ============================================================
   *
   * Las coordenadas son aproximadas y están pensadas para
   * representar visualmente el itinerario.
   *
   * Pueden sustituirse fácilmente por coordenadas exactas
   * de cada prestador/entrada/sendero.
   */

  const itinerary = {

    1: {
      title: "Bienvenidos al Fin del Mundo",
      subtitle: "Llegada, recepción y primera toma de contacto con Ushuaia",
      color: "#2878b5",

      points: [

        {
          name: "Aeropuerto Internacional Malvinas Argentinas",
          time: "Según horario del vuelo",
          description:
            "Recepción de pasajeros y traslado privado hacia el alojamiento.",
          coords: [-54.8433, -68.2958]
        },

        {
          name: "Centro de Ushuaia",
          time: "Llegada / Check-in",
          description:
            "Ingreso al hotel, distribución de habitaciones y tiempo para descansar.",
          coords: [-54.8019, -68.3030]
        },

        {
          name: "Puerto de Ushuaia",
          time: "Tarde libre",
          description:
            "Paseo por la costanera, puerto y entorno urbano.",
          coords: [-54.8072, -68.3018]
        },

        {
          name: "Costanera de Ushuaia",
          time: "Actividad de bienvenida",
          description:
            "Caminata introductoria por la costanera como primer contacto con el Canal Beagle.",
          coords: [-54.8060, -68.3000]
        }

      ]
    },


    2: {
      title: "Donde termina la ruta y comienza la aventura",
      subtitle: "Parque Nacional Tierra del Fuego + Tren del Fin del Mundo",
      color: "#2d8a57",

      points: [

        {
          name: "Ushuaia",
          time: "08:45",
          description:
            "Salida desde Ushuaia en minibús turístico hacia la Estación del Fin del Mundo.",
          coords: [-54.8019, -68.3030]
        },

        {
          name: "Estación del Fin del Mundo",
          time: "09:15 / 09:30",
          description:
            "Inicio del recorrido en el Tren del Fin del Mundo.",
          coords: [-54.8085, -68.4415]
        },

        {
          name: "Estación Macarena",
          time: "Durante el recorrido",
          description:
            "Parada intermedia aproximada de 15 minutos.",
          coords: [-54.8095, -68.4580]
        },

        {
          name: "Estación Parque Nacional",
          time: "11:15",
          description:
            "Finalización del recorrido ferroviario y continuación en vehículo.",
          coords: [-54.8350, -68.5040]
        },

        {
          name: "Ensenada Zaratiegui",
          time: "11:45",
          description:
            "Parada panorámica costera. Caminata corta, fotografía y contemplación.",
          coords: [-54.8335, -68.5270]
        },

        {
          name: "Lago Acigami",
          time: "13:30",
          description:
            "Visita al lago rodeado de bosques y montañas. Caminata e interpretación ambiental.",
          coords: [-54.8350, -68.5660]
        },

        {
          name: "Bahía Lapataia",
          time: "14:30",
          description:
            "Uno de los lugares más representativos del Parque Nacional y punto final de la Ruta Nacional Nº 3.",
          coords: [-54.8390, -68.5500]
        },

        {
          name: "Mirador Lapataia",
          time: "15:00",
          description:
            "Sendero de baja dificultad de aproximadamente 980 metros.",
          coords: [-54.8380, -68.5460]
        },

        {
          name: "Pasarelas de Bahía Lapataia",
          time: "16:00",
          description:
            "Tiempo para fotografía, interpretación del paisaje y contemplación.",
          coords: [-54.8397, -68.5525]
        },

        {
          name: "Regreso a Ushuaia",
          time: "17:00",
          description:
            "Retorno hacia la ciudad y llegada estimada al hotel entre 18:00 y 18:30.",
          coords: [-54.8019, -68.3030]
        }

      ]
    },


    3: {
      title: "El espejo verde de la montaña",
      subtitle: "Trekking Laguna Esmeralda",
      color: "#b27b24",

      points: [

        {
          name: "Ushuaia",
          time: "08:15",
          description:
            "Salida desde Ushuaia hacia el inicio del sendero.",
          coords: [-54.8019, -68.3030]
        },

        {
          name: "Inicio del sendero Laguna Esmeralda",
          time: "08:45",
          description:
            "Inicio del trekking. Distancia aproximada de 9 km ida y vuelta.",
          coords: [-54.7115, -68.0180]
        },

        {
          name: "Bosque de lenga y turbal",
          time: "Durante el trekking",
          description:
            "El sendero atraviesa bosque de lenga, turberas, arroyos y ambientes de montaña.",
          coords: [-54.7100, -68.0230]
        },

        {
          name: "Laguna Esmeralda",
          time: "11:00 / 11:30",
          description:
            "Llegada a la laguna de origen glaciario. Tiempo para descanso, fotografías y contemplación.",
          coords: [-54.7055, -68.0350]
        },

        {
          name: "Regreso por el sendero",
          time: "12:30",
          description:
            "Inicio del regreso por el mismo sendero.",
          coords: [-54.7115, -68.0180]
        },

        {
          name: "Ushuaia",
          time: "15:30 / 16:00",
          description:
            "Llegada aproximada a la ciudad y tarde libre.",
          coords: [-54.8019, -68.3030]
        }

      ]
    },


    4: {
      title: "Navegando hacia el Fin del Mundo",
      subtitle: "Canal Beagle + Faro Les Éclaireurs",
      color: "#7654a8",

      points: [

        {
          name: "Puerto de Ushuaia",
          time: "09:00 / 09:30",
          description:
            "Traslado al puerto y embarque para la navegación por el Canal Beagle.",
          coords: [-54.8072, -68.3018]
        },

        {
          name: "Isla de los Pájaros",
          time: "10:00",
          description:
            "Observación de aves marinas y explicación del ecosistema del Canal Beagle.",
          coords: [-54.8680, -68.4510]
        },

        {
          name: "Isla de los Lobos",
          time: "10:30",
          description:
            "Observación de fauna marina.",
          coords: [-54.8715, -68.4690]
        },

        {
          name: "Faro Les Éclaireurs",
          time: "11:00",
          description:
            "Parada fotográfica y explicación del valor histórico y paisajístico del faro.",
          coords: [-54.8730, -68.4780]
        },

        {
          name: "Isla Bridges",
          time: "11:30",
          description:
            "Posible desembarco y sendero interpretativo según modalidad de navegación contratada.",
          coords: [-54.8860, -68.4410]
        },

        {
          name: "Puerto de Ushuaia",
          time: "12:30",
          description:
            "Regreso al puerto y finalización de la navegación.",
          coords: [-54.8072, -68.3018]
        },

        {
          name: "Centro de Ushuaia",
          time: "13:00",
          description:
            "Almuerzo libre y tarde de paseo, compras, cafetería o descanso.",
          coords: [-54.8019, -68.3030]
        }

      ]
    },


    5: {
      title: "Entre el bosque y el hielo",
      subtitle: "Glaciar Martial + mirador panorámico + regreso",
      color: "#c65345",

      points: [

        {
          name: "Ushuaia",
          time: "09:00",
          description:
            "Check-out y traslado hacia Cerro Martial.",
          coords: [-54.8019, -68.3030]
        },

        {
          name: "Base Cerro Martial",
          time: "09:30 / 10:00",
          description:
            "Inicio del circuito hacia el Mirador del Glaciar Martial.",
          coords: [-54.7850, -68.3920]
        },

        {
          name: "Mirador del Glaciar Martial",
          time: "10:00",
          description:
            "Circuito aproximado de 2.500 metros, 75 minutos y 220 metros de desnivel.",
          coords: [-54.7785, -68.3890]
        },

        {
          name: "Panorámica de Ushuaia",
          time: "11:30",
          description:
            "Tiempo para fotografías, contemplación y descanso.",
          coords: [-54.7795, -68.3900]
        },

        {
          name: "Descenso",
          time: "12:00",
          description:
            "Regreso hacia la base del Cerro Martial.",
          coords: [-54.7850, -68.3920]
        },

        {
          name: "Ushuaia",
          time: "13:00",
          description:
            "Almuerzo libre y último paseo por la ciudad.",
          coords: [-54.8019, -68.3030]
        },

        {
          name: "Aeropuerto Internacional Malvinas Argentinas",
          time: "15:30 / 16:00",
          description:
            "Traslado privado al aeropuerto. Fin del circuito.",
          coords: [-54.8433, -68.2958]
        }

      ]
    }

  };


  /*
   * ============================================================
   * MAPA
   * ============================================================
   */

  const map = L.map("map", {
    zoomControl: true
  }).setView([-54.805, -68.35], 11);


  /*
   * Mapa base
   */

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }
  ).addTo(map);


  /*
   * Capas por día
   */

  const layers = {};

  const markers = {};


  /*
   * Iconos
   */

  function createIcon(color) {

    return L.divIcon({
      className: "",
      html: `
        <div style="
          width:28px;
          height:28px;
          border-radius:50%;
          background:${color};
          border:4px solid white;
          box-shadow:0 2px 8px rgba(0,0,0,.35);
        "></div>
      `,
      iconSize: [28,28],
      iconAnchor: [14,14],
      popupAnchor: [0,-15]
    });

  }


  /*
   * Crear capas
   */

  Object.keys(itinerary).forEach(day => {

    const data = itinerary[day];

    layers[day] = L.layerGroup().addTo(map);

    markers[day] = [];

    const coords = [];

    data.points.forEach((point, index) => {

      coords.push(point.coords);

      const marker = L.marker(
        point.coords,
        {
          icon: createIcon(data.color)
        }
      );

      marker.bindPopup(`
        <div class="popup">

          <div class="popup-day">
            DÍA ${day}
          </div>

          <h3>${point.name}</h3>

          <div class="popup-time">
            ${point.time}
          </div>

          <p>
            ${point.description}
          </p>

        </div>
      `);

      marker.addTo(layers[day]);

      markers[day].push(marker);

    });


    /*
     * Línea de recorrido
     */

    if (coords.length > 1) {

      L.polyline(
        coords,
        {
          color: data.color,
          weight: 4,
          opacity: .75,
          dashArray: day === "4" ? "8,8" : null
        }
      ).addTo(layers[day]);

    }

  });


  /*
   * ============================================================
   * CONTENIDO SIDEBAR
   * ============================================================
   */

  function renderDay(day) {

    const data = itinerary[day];

    document.querySelectorAll(".day-btn")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.day === day
        );

      });


    const content = document.getElementById("content");

    content.innerHTML = `

      <div class="day-header">

        <h2>
          Día ${day} · ${data.title}
        </h2>

        <p>
          ${data.subtitle}
        </p>

      </div>

      <div class="timeline">

        ${data.points.map((point, index) => `

          <div
            class="event"
            data-day="${day}"
            data-index="${index}"
          >

            <div
              class="event-dot"
              style="
                background:${data.color};
                box-shadow:0 0 0 2px ${data.color};
              "
            ></div>

            <div class="event-card">

              <div class="event-time">
                ${point.time}
              </div>

              <div class="event-title">
                ${point.name}
              </div>

              <div class="event-description">
                ${point.description}
              </div>

            </div>

          </div>

        `).join("")}

      </div>

    `;


    /*
     * Eventos del timeline
     */

    document.querySelectorAll(".event").forEach(event => {

      event.addEventListener("click", () => {

        const index = Number(event.dataset.index);

        const marker = markers[day][index];

        map.setView(
          marker.getLatLng(),
          14,
          {
            animate: true
          }
        );

        marker.openPopup();

      });

    });


    /*
     * Mostrar únicamente el día seleccionado
     */

    Object.keys(layers).forEach(d => {

      if (d === day) {

        if (!map.hasLayer(layers[d])) {
          layers[d].addTo(map);
        }

      } else {

        if (map.hasLayer(layers[d])) {
          map.removeLayer(layers[d]);
        }

      }

    });


    /*
     * Ajustar mapa a los puntos del día
     */

    const bounds = L.latLngBounds(
      data.points.map(point => point.coords)
    );

    map.fitBounds(
      bounds,
      {
        padding: [45, 45]
      }
    );

  }


  /*
   * Botones de días
   */

  document.querySelectorAll(".day-btn").forEach(button => {

    button.addEventListener("click", () => {

      renderDay(button.dataset.day);

    });

  });


  /*
   * ============================================================
   * CONTROLES DEL MAPA
   * ============================================================
   */

  const controls = L.control({ position: "topright" });

  controls.onAdd = function() {

    const div = L.DomUtil.create(
      "div",
      "map-controls"
    );

    div.innerHTML = `

      <button
        class="map-control"
        id="showAll"
      >
        🗺️ Ver circuito completo
      </button>

      <button
        class="map-control"
        id="resetMap"
      >
        📍 Ushuaia
      </button>

    `;

    return div;

  };

  controls.addTo(map);


  /*
   * Ver circuito completo
   */

  document
    .getElementById("showAll")
    .addEventListener("click", () => {

      Object.keys(layers).forEach(day => {

        if (!map.hasLayer(layers[day])) {
          layers[day].addTo(map);
        }

      });


      const allPoints = [];

      Object.values(itinerary).forEach(day => {

        day.points.forEach(point => {

          allPoints.push(point.coords);

        });

      });


      map.fitBounds(
        L.latLngBounds(allPoints),
        {
          padding: [50,50]
        }
      );

    });


  /*
   * Volver a Ushuaia
   */

  document
    .getElementById("resetMap")
    .addEventListener("click", () => {

      map.setView(
        [-54.8019, -68.3030],
        12,
        {
          animate: true
        }
      );

    });


  /*
   * Iniciar mostrando Día 1
   */

  renderDay("1");

</script>

</body>
</html>
