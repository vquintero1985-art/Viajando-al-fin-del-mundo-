<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ushuaia · Fin del Mundo</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: #eef3f4;
}

#app {
  width: 100%;
  height: 100vh;
  display: flex;
}

/* ================================
   PANEL
================================ */

#panel {
  width: 390px;
  min-width: 390px;
  height: 100vh;
  overflow-y: auto;
  background: #fff;
  z-index: 1000;
}

.header {
  padding: 28px 24px;
  color: white;

  background:
    linear-gradient(
      rgba(5,40,50,.84),
      rgba(5,40,50,.84)
    ),
    linear-gradient(
      135deg,
      #1d7181,
      #082d38
    );
}

.header small {
  text-transform: uppercase;
  letter-spacing: 2px;
  opacity: .7;
}

.header h1 {
  margin: 8px 0 0;
  font-size: 29px;
  line-height: 1.1;
}

.header p {
  font-size: 13px;
  line-height: 1.5;
  opacity: .88;
  margin-bottom: 0;
}

/* ================================
   DIAS
================================ */

.days {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  padding: 12px;
  position: sticky;
  top: 0;
  background: white;
  z-index: 20;
}

.day {
  border: 0;
  border-radius: 9px;
  padding: 11px 3px;
  background: #edf2f3;
  color: #40545b;
  font-weight: bold;
  cursor: pointer;
}

.day.active {
  background: #116778;
  color: white;
}

/* ================================
   CONTENIDO
================================ */

#content {
  padding: 8px 18px 30px;
}

.title {
  padding: 5px 3px 15px;
}

.title .day-number {
  font-size: 11px;
  text-transform: uppercase;
  color: #116778;
  font-weight: bold;
  letter-spacing: 1px;
}

.title h2 {
  margin: 5px 0;
  font-size: 22px;
  color: #163d46;
}

.title p {
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
  color: #728087;
}

/* ================================
   TIMELINE
================================ */

.timeline {
  position: relative;
}

.timeline:before {
  content: "";
  position: absolute;
  left: 10px;
  top: 8px;
  bottom: 10px;
  width: 2px;
  background: #dbe5e8;
}

.event {
  position: relative;
  padding-left: 30px;
  margin-bottom: 12px;
  cursor: pointer;
}

.dot {
  position: absolute;
  left: 3px;
  top: 14px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 3px solid white;
  box-shadow: 0 0 0 2px #116778;
}

.card {
  padding: 12px;
  border-radius: 11px;
  border: 1px solid #e1e9eb;
  background: #f8fafb;
}

.card:hover {
  background: #eef7f8;
}

.time {
  color: #116778;
  font-size: 11px;
  font-weight: bold;
}

.name {
  margin-top: 3px;
  font-size: 14px;
  font-weight: bold;
  color: #294149;
}

.description {
  margin-top: 4px;
  font-size: 11.5px;
  line-height: 1.45;
  color: #718087;
}

/* ================================
   MAPA
================================ */

#map {
  flex: 1;
  height: 100vh;
}

/* ================================
   POPUP
================================ */

.popup {
  min-width: 210px;
}

.popup h3 {
  margin: 4px 0;
  color: #153e48;
}

.popup .time {
  margin-bottom: 6px;
}

.popup p {
  font-size: 12px;
  line-height: 1.5;
  color: #66777d;
}

/* ================================
   CONTROLES
================================ */

.controls {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.control {
  border: 0;
  background: white;
  padding: 10px 13px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 11px;
  cursor: pointer;
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
}

/* ================================
   MOBILE
================================ */

@media(max-width:800px) {

  #app {
    display: block;
    height: auto;
  }

  #panel {
    width: 100%;
    min-width: 0;
    height: auto;
  }

  .header {
    padding: 22px 18px;
  }

  .header h1 {
    font-size: 25px;
  }

  .days {
    padding: 8px;
  }

  .day {
    font-size: 10px;
    padding: 10px 2px;
  }

  #content {
    padding: 5px 13px 20px;
  }

  #map {
    width: 100%;
    height: 68vh;
    min-height: 450px;
  }

}

</style>
</head>

<body>

<div id="app">

  <aside id="panel">

    <header class="header">

      <small>
        Tierra del Fuego · Argentina
      </small>

      <h1>
        Bienvenidos al<br>
        Fin del Mundo
      </h1>

      <p>
        Circuito de 5 días por Ushuaia,
        naturaleza, aventura y Canal Beagle.
      </p>

    </header>


    <nav class="days">

      <button class="day active" data-day="1">
        DÍA 1
      </button>

      <button class="day" data-day="2">
        DÍA 2
      </button>

      <button class="day" data-day="3">
        DÍA 3
      </button>

      <button class="day" data-day="4">
        DÍA 4
      </button>

      <button class="day" data-day="5">
        DÍA 5
      </button>

    </nav>


    <section id="content"></section>

  </aside>


  <main id="map"></main>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/*
==============================================================
COLORES
==============================================================
*/

const colors = {
  1: "#2878b5",
  2: "#23845a",
  3: "#b27b24",
  4: "#7654a8",
  5: "#c65345"
};


/*
==============================================================
PUNTOS GEOGRÁFICOS
==============================================================

IMPORTANTE:

Estos son PUNTOS DE REFERENCIA.

No se dibujan líneas artificiales entre todos ellos.
==============================================================
*/

const P = {

  /* CIUDAD */

  ushuaia: [-54.8019, -68.3030],

  airport: [-54.8433, -68.2958],

  port: [-54.8085, -68.3025],


  /* PARQUE NACIONAL */

  trainStation: [-54.8332, -68.4238],

  parkArea: [-54.8300, -68.4900],

  ensenada: [-54.8315, -68.5350],

  acigami: [-54.8390, -68.5650],

  lapataia: [-54.8553, -68.5768],


  /* LAGUNA */

  esmeraldaStart: [-54.72053, -68.12414],

  esmeralda: [-54.69231, -68.12884],


  /* MARTIAL */

  martial: [-54.79891, -68.37017],


  /* CANAL BEAGLE */

  birds: [-54.8690, -68.0900],

  wolves: [-54.8710, -68.0800],

  lighthouse: [-54.87155, -68.08325],

  bridges: [-54.8900, -68.4300]

};


/*
==============================================================
DATOS
==============================================================
*/

const days = {

1: {

  title: "Bienvenidos al Fin del Mundo",

  subtitle:
    "Llegada, recepción, descanso y primera caminata por Ushuaia.",

  points: [

    {
      name: "Aeropuerto Internacional Malvinas Argentinas",
      time: "Según horario del vuelo",
      coords: P.airport,
      description:
        "Recepción de pasajeros y traslado privado hacia el alojamiento."
    },

    {
      name: "Ushuaia · Alojamiento",
      time: "Check-in",
      coords: P.ushuaia,
      description:
        "Ingreso al hotel, distribución de habitaciones y tiempo para descansar."
    },

    {
      name: "Puerto de Ushuaia",
      time: "Tarde libre",
      coords: P.port,
      description:
        "Paseo por la costanera, puerto y centro de Ushuaia."
    }

  ]

},


2: {

  title:
    "Donde termina la ruta y comienza la aventura",

  subtitle:
    "Parque Nacional Tierra del Fuego + Tren del Fin del Mundo.",

  points: [

    {
      name: "Ushuaia",
      time: "08:45",
      coords: P.ushuaia,
      description:
        "Salida desde Ushuaia hacia la Estación del Fin del Mundo."
    },

    {
      name: "Estación del Fin del Mundo",
      time: "09:15 / 09:30",
      coords: P.trainStation,
      description:
        "Inicio del recorrido en el Tren del Fin del Mundo."
    },

    {
      name: "Parque Nacional Tierra del Fuego",
      time: "11:15",
      coords: P.parkArea,
      description:
        "Continuación del recorrido por el Parque Nacional."
    },

    {
      name: "Ensenada Zaratiegui",
      time: "11:45",
      coords: P.ensenada,
      description:
        "Parada panorámica sobre el sector costero."
    },

    {
      name: "Lago Acigami",
      time: "13:30",
      coords: P.acigami,
      description:
        "Visita al lago y caminata corta."
    },

    {
      name: "Bahía Lapataia",
      time: "14:30",
      coords: P.lapataia,
      description:
        "Uno de los principales puntos del Parque Nacional y final de la Ruta Nacional Nº 3."
    },

    {
      name: "Regreso a Ushuaia",
      time: "17:00",
      coords: P.ushuaia,
      description:
        "Retorno hacia la ciudad."
    }

  ]

},


3: {

  title:
    "El espejo verde de la montaña",

  subtitle:
    "Trekking Laguna Esmeralda.",

  points: [

    {
      name: "Ushuaia",
      time: "08:15",
      coords: P.ushuaia,
      description:
        "Salida hacia el comienzo del trekking."
    },

    {
      name: "Inicio Sendero Laguna Esmeralda",
      time: "08:45",
      coords: P.esmeraldaStart,
      description:
        "Inicio del trekking. Distancia programada: aproximadamente 9 km ida y vuelta."
    },

    {
      name: "Laguna Esmeralda",
      time: "11:00 / 11:30",
      coords: P.esmeralda,
      description:
        "Llegada a la laguna de origen glaciario."
    },

    {
      name: "Regreso a Ushuaia",
      time: "15:30 / 16:00",
      coords: P.ushuaia,
      description:
        "Finalización del trekking y regreso a la ciudad."
    }

  ]

},


4: {

  title:
    "Navegando hacia el Fin del Mundo",

  subtitle:
    "Canal Beagle · fauna marina · Faro Les Éclaireurs.",

  points: [

    {
      name: "Puerto de Ushuaia",
      time: "09:30",
      coords: P.port,
      description:
        "Embarque para la navegación."
    },

    {
      name: "Isla de los Pájaros",
      time: "10:00",
      coords: P.birds,
      description:
        "Observación de aves marinas."
    },

    {
      name: "Isla de los Lobos",
      time: "10:30",
      coords: P.wolves,
      description:
        "Observación de fauna marina."
    },

    {
      name: "Faro Les Éclaireurs",
      time: "11:00",
      coords: P.lighthouse,
      description:
        "Parada fotográfica frente al faro."
    },

    {
      name: "Isla Bridges",
      time: "11:30",
      coords: P.bridges,
      description:
        "Posible desembarco y caminata interpretativa, según la navegación contratada."
    },

    {
      name: "Puerto de Ushuaia",
      time: "12:30",
      coords: P.port,
      description:
        "Regreso al puerto."
    }

  ]

},


5: {

  title:
    "Entre el bosque y el hielo",

  subtitle:
    "Glaciar Martial + mirador + regreso al aeropuerto.",

  points: [

    {
      name: "Ushuaia",
      time: "09:00",
      coords: P.ushuaia,
      description:
        "Check-out y salida hacia Cerro Martial."
    },

    {
      name: "Glaciar Martial",
      time: "09:30 / 10:00",
      coords: P.martial,
      description:
        "Llegada al sector del Glaciar Martial."
    },

    {
      name: "Circuito / Mirador Martial",
      time: "10:00",
      coords: P.martial,
      description:
        "Circuito de montaña según el itinerario previsto."
    },

    {
      name: "Ushuaia",
      time: "13:00",
      coords: P.ushuaia,
      description:
        "Almuerzo libre y retiro del equipaje."
    },

    {
      name: "Aeropuerto Internacional Malvinas Argentinas",
      time: "15:30 / 16:00",
      coords: P.airport,
      description:
        "Traslado privado al aeropuerto."
    }

  ]

}

};


/*
==============================================================
MAPA
==============================================================
*/

const map = L.map("map", {
  zoomControl: true
}).setView(
  P.ushuaia,
  11
);


/*
==============================================================
MAPA BASE
==============================================================
*/

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,

    attribution:
      '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>'
  }
).addTo(map);


/*
==============================================================
CAPAS
==============================================================
*/

const layers = {};


/*
==============================================================
ICONOS
==============================================================
*/

function makeIcon(day) {

  return L.divIcon({

    className: "",

    html: `
      <div style="
        width:32px;
        height:32px;
        background:${colors[day]};
        border:3px solid white;
        border-radius:50%;
        box-shadow:0 2px 9px rgba(0,0,0,.35);
        display:flex;
        align-items:center;
        justify-content:center;
        color:white;
        font-weight:bold;
        font-size:13px;
      ">
        ${day}
      </div>
    `,

    iconSize: [32,32],

    iconAnchor: [16,16],

    popupAnchor: [0,-17]

  });

}


/*
==============================================================
POPUP
==============================================================
*/

function popup(day, point) {

  return `

    <div class="popup">

      <h3>
        ${point.name}
      </h3>

      <div class="time">
        Día ${day} · ${point.time}
      </div>

      <p>
        ${point.description}
      </p>

    </div>

  `;

}


/*
==============================================================
CREAR MARCADORES
==============================================================
*/

Object.keys(days).forEach(day => {

  layers[day] = L.layerGroup();

  days[day].points.forEach(point => {

    const marker =
      L.marker(
        point.coords,
        {
          icon: makeIcon(day)
        }
      );

    marker.bindPopup(
      popup(day, point)
    );

    marker.addTo(
      layers[day]
    );

  });

});


/*
==============================================================
RECORRIDOS

MUY IMPORTANTE:

No usamos líneas falsas que unan todos los puntos.

Cada recorrido se dibuja de manera independiente.
==============================================================
*/


/*
--------------------------------------------------------------
DÍA 1
--------------------------------------------------------------
*/

L.polyline(

  [
    P.airport,
    [-54.8280, -68.3020],
    P.ushuaia
  ],

  {
    color: colors[1],
    weight: 4,
    opacity: .75
  }

).addTo(layers[1]);


/*
--------------------------------------------------------------
DÍA 2

Carretera aproximada:
Ushuaia → Estación → Parque → Ensenada →
Acigami → Lapataia

No se dibuja una línea recta entre todos los atractivos.
--------------------------------------------------------------
*/

L.polyline(

  [
    P.ushuaia,

    [-54.8100,-68.3350],
    [-54.8200,-68.3700],
    [-54.8300,-68.4050],

    P.trainStation,

    [-54.8350,-68.4550],
    [-54.8350,-68.5000],

    P.ensenada,

    [-54.8350,-68.5500],

    P.acigami,

    [-54.8470,-68.5700],

    P.lapataia
  ],

  {
    color: colors[2],
    weight: 5,
    opacity: .75
  }

).addTo(layers[2]);


/*
--------------------------------------------------------------
DÍA 3

Aquí NO afirmamos que esta línea sea el sendero GPS exacto.

Es una representación conceptual del trekking.
--------------------------------------------------------------
*/

L.polyline(

  [
    P.esmeraldaStart,

    [-54.716,-68.124],
    [-54.710,-68.125],
    [-54.704,-68.127],
    [-54.698,-68.129],

    P.esmeralda
  ],

  {
    color: colors[3],
    weight: 5,
    opacity: .85,
    dashArray: "7 7"
  }

).addTo(layers[3]);


/*
--------------------------------------------------------------
DÍA 4

NAVEGACIÓN

La escala y posición de los puntos son las del Canal Beagle.

No se intenta hacer pasar la embarcación por tierra.
--------------------------------------------------------------
*/

L.polyline(

  [
    P.port,

    [-54.825,-68.260],

    P.birds,

    P.wolves,

    P.lighthouse,

    P.bridges,

    [-54.825,-68.260],

    P.port
  ],

  {
    color: colors[4],
    weight: 5,
    opacity: .8,
    dashArray: "10 8"
  }

).addTo(layers[4]);


/*
--------------------------------------------------------------
DÍA 5
--------------------------------------------------------------
*/

L.polyline(

  [
    P.ushuaia,

    [-54.790,-68.335],
    P.martial,

    P.ushuaia,

    P.airport
  ],

  {
    color: colors[5],
    weight: 5,
    opacity: .75
  }

).addTo(layers[5]);


/*
==============================================================
MOSTRAR DÍA
==============================================================
*/

function showDay(day) {

  document
    .querySelectorAll(".day")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.day === String(day)
      );

    });


  Object.keys(layers).forEach(d => {

    if (String(d) === String(day)) {

      layers[d].addTo(map);

    } else {

      map.removeLayer(
        layers[d]
      );

    }

  });


  const data = days[day];

  document.getElementById("content").innerHTML = `

    <div class="title">

      <div class="day-number">
        Día ${day}
      </div>

      <h2>
        ${data.title}
      </h2>

      <p>
        ${data.subtitle}
      </p>

    </div>

    <div class="timeline">

      ${data.points.map(
        (point,index) => `

          <div
            class="event"
            data-day="${day}"
            data-index="${index}"
          >

            <div
              class="dot"
              style="
                background:${colors[day]};
                box-shadow:
                  0 0 0 2px ${colors[day]};
              "
            ></div>

            <div class="card">

              <div class="time">
                ${point.time}
              </div>

              <div class="name">
                ${point.name}
              </div>

              <div class="description">
                ${point.description}
              </div>

            </div>

          </div>

        `
      ).join("")}

    </div>

  `;


  /*
  Click sobre actividad
  */

  document
    .querySelectorAll(".event")
    .forEach((event,index) => {

      event.addEventListener(
        "click",
        () => {

          const point =
            data.points[index];

          map.flyTo(
            point.coords,
            14,
            {
              duration: 1
            }
          );

          /*
          Buscar marcador correspondiente
          */

          let counter = 0;

          layers[day].eachLayer(
            marker => {

              if (
                marker.getLatLng &&
                marker.getLatLng().lat === point.coords[0] &&
                marker.getLatLng().lng === point.coords[1]
              ) {

                marker.openPopup();

              }

              counter++;

            }
          );

        }
      );

    });


  /*
  Ajustar mapa
  */

  const bounds =
    L.latLngBounds(
      data.points.map(
        point => point.coords
      )
    );

  map.fitBounds(
    bounds,
    {
      padding: [60,60]
    }
  );

}


/*
==============================================================
BOTONES
==============================================================
*/

document
  .querySelectorAll(".day")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        showDay(
          button.dataset.day
        );

      }
    );

  });


/*
==============================================================
CONTROLES
==============================================================
*/

const control =
  L.control({
    position: "topright"
  });


control.onAdd = function() {

  const div =
    L.DomUtil.create(
      "div",
      "controls"
    );

  div.innerHTML = `

    <button
      class="control"
      id="full"
    >
      🗺️ VER CIRCUITO
    </button>

    <button
      class="control"
      id="city"
    >
      📍 USHUAIA
    </button>

  `;

  return div;

};


control.addTo(map);


/*
==============================================================
CIRCUITO COMPLETO
==============================================================
*/

document
  .getElementById("full")
  .addEventListener(
    "click",
    () => {

      Object.values(layers)
        .forEach(layer => {

          layer.addTo(map);

        });


      map.fitBounds(

        L.latLngBounds([

          P.airport,
          P.ushuaia,
          P.trainStation,
          P.lapataia,
          P.esmeralda,
          P.martial,
          P.lighthouse

        ]),

        {
          padding: [40,40]
        }

      );

    }
  );


/*
==============================================================
USHUAIA
==============================================================
*/

document
  .getElementById("city")
  .addEventListener(
    "click",
    () => {

      map.flyTo(
        P.ushuaia,
        12,
        {
          duration: 1
        }
      );

    }
  );


/*
==============================================================
INICIO
==============================================================
*/

showDay(1);

</script>

</body>
</html>
